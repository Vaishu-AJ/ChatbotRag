services:
  - type: web
    name: rag-system
    runtime: python
    plan: starter
    buildCommand: pip install ".[media]" && cd frontend && npm ci && npm run build
    startCommand: uvicorn rag_system.api:app --host 0.0.0.0 --port $PORT --app-dir src
    healthCheckPath: /api/bootstrap
    disk:
      name: rag-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RAG_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: PDF_DIRECTORY
        value: /var/data/documents
      - key: VECTOR_STORE_DIRECTORY
        value: /var/data/vector_store
      - key: CHAT_HISTORY_FILE
        value: /var/data/chat_history.json
